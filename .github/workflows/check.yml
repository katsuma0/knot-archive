# Lints every registered knot in headless Chromium on pull requests.
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  knots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tools/check.mjs
